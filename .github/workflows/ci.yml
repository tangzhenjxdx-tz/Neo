name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: neo check examples/good
      - run: neo new ci-bot --name 冒烟 --job "只做一件小事。" --out /tmp/neo-smoke && neo check /tmp/neo-smoke/ci-bot.md
